appId: app.getbb.mobile
env:
  METRO_URL: "http://127.0.0.1:8082"
  SERVER_URL: "http://127.0.0.1:41998"
---
- runFlow: ../subflows/launch-app.yaml
- runFlow: ../subflows/pair-direct-server.yaml
- runScript:
    file: ../scripts/timeout-control.js
    env:
      TIMEOUT_ACTION: "fail"
- runFlow:
    file: ../subflows/open-bb-link.yaml
    env:
      LINK: "bb://threads"
- extendedWaitUntil:
    visible: "HTTP 504"
    timeout: 30000
- takeScreenshot: timeout-error
- tapOn:
    id: "shell-retry"
- extendedWaitUntil:
    visible: "HTTP 504"
    timeout: 30000
- takeScreenshot: retry-while-offline
- runScript:
    file: ../scripts/timeout-control.js
    env:
      TIMEOUT_ACTION: "recover"
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: "HTTP 504"
- takeScreenshot: restored-network-after-foreground
- tapOn:
    id: "shell-retry"
- extendedWaitUntil:
    visible:
      id: "shell-webview"
    timeout: 30000
- assertNotVisible: "HTTP 504"
- takeScreenshot: recovered-without-restart
